<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<canvas id="C"
    style="position: fixed; top: 50vh; left: 50vw; translate: -50% -50%; width: min(100vw, 100vh); image-rendering: pixelated"
    width="64" height="64"
></canvas>
<table id="J">
    <tr><td><button id="D">🅑</button></td><td><button id="E">⬆</button></td></tr>
    <tr><td><button id="F">⬅</button></td><td><button id="G">🅐</button></td><td><button id="H">➡</button></td></tr>
    <tr><td></td><td><button id="I">⬇</button></td></tr>
</tr>
</table>
<script>
    let g = new Uint8Array("$PAD"),
        r = new Uint8Array(8),
        c = C.getContext("2d"),
        W = "#fff", L = "#000",
        b = [G, D, F, H, E, I],
        B = document.body.style,
        s = [], p = i = t = S = K = 0,
        z = new Uint8Array(4096);
    for(x of b) x.style.fontSize = "200%";
    c.fillStyle = W;
    c.fillRect(0, 0, 64, 64);
    J.setAttribute("style", "position:fixed;bottom:1em;right:1em");
    g.set(Uint8Array.from(atob("$BASE64"), x => x.charCodeAt()));
    b.forEach((e, i) => {
        e.onpointerdown = _ => K |= 1 << i;
        e.onpointerup = _ => K &= ~(1 << i);
    });
    setInterval(_ => {
        B.background = S ? W : L;
        x = g[i], y = g[i + 1];
        V = (y >> 3) & 7;
        U = x & 248;
        M = ((x & 7) << 8) | y;
        N = r[x & 7];
        O = r[y & 7];
        P = r[V];
        if(x == 16) {
            c.fillStyle = W;
            c.fillRect(0, 0, 64, 64);
            z.fill();
        } if(x == 17)
            i = s.pop();
        if(U == 128)
            i = M - 2;
        if(U == 136) {
            s.push(i);
            i = M;
        } if(U == 144 && N == y)
            i += 2;
        if(U == 152 && N != y)
            i += 2;
        if(x == 64 && P == O)
            i += 2;
        if(x == 65 && P != O)
            i += 2;
        if(U == 160)
            r[x & 7] = y;
        if(U == 168) {
            r[x & 7] = a = N + y;
            r[7] = a < 0;
        } if(x == 66) {
            r[V] = a = P + O;
            r[7] = a > 255;
        } if(x == 67) {
            r[V] = a = P - O;
            r[7] = a < 0;
        } if(x == 68) {
            r[V] = a = O - P;
            r[7] = a < 0;
        } if(x == 69)
            r[V] = O;
        if(x == 70)
            r[V] = P | O;
        if(x == 71)
            r[V] = P & O;
        if(x == 72)
            r[V] = P ^ O;
        if(x == 73) {
            r[V] = O >> 1;
            r[7] = [y & 7] & 1;
        } if(x == 74) {
            r[V] = O << 1;
            r[7] = O >> 7;
        } if(U == 176)
            p = M;
        if(U == 184)
            p = M + r[0];
        if(U == 192)
            r[x & 7] = Math.floor(Math.random() * 256) & y;
        if((x & 240) == 240) {
            let o = false;
            for(let j = 0; j < (y & 63) + 1; j++)
                for(let k = 0; k < 8; k++) {
                    X = r[(x & 15) >> 1] + k;
                    Y = r[((x & 1) << 2) | ((y & 192) >> 6)] + j;
                    if(X > 63 || Y > 63) continue;
                    a = !!((g[p + j] >> k) & 1);
                    Q = z[X + Y * 64] != a;
                    c.fillStyle = Q ? L : W;
                    c.fillRect(X, Y, 1, 1);
                    o ||= !Q && a;
                    z[X + Y * 64] = Q;
                }
            r[7] = o;
        } if(x == 32 && (K >> O) & 1)
            i += 2;
        if(x == 33 && !((K >> O) & 1))
            i += 2;
        if(x == 34 && (K >> y) & 1)
            i += 2;
        if(x == 35 && !((K >> y) & 1))
            i += 2;
        if(x == 36) {
            if(K == 0) i -= 2;
            else r[y & 7] = Math.log2(K);
        } if(x == 37)
            r[y & 7] = t;
        if(x == 38)
            t = O;
        if(x == 39)
            S = O;
        if(x == 40)
            p += O;
        if(x == 41) {
            g[p] = O / 100;
            g[p + 1] = (O / 10) % 10;
            g[p + 2] = O % 10;
        } if(x == 42) {
            for(let j = 0; j <= y & 7; j++)
                g[p++] = r[j];
        } if(x == 43) {
            for(let j = 0; j <= y & 7; j++)
                r[j] = g[p++];
        }
        i += 2;
    }, 10);
    setInterval(_ => {
        if(t) t--;
        if(S) S--;
    }, 50);
</script>
